name: skill-invocation-eval
description: Evaluate the skill in spec repo has correct invocation

config:
  runs: 1
  timeout: 600
  model: claude-opus-4.6-1m
  executor: copilot-sdk

environment:
  mcpServers:
    azure-sdk-mcp:
      type: stdio
      command: pwsh
      args: ["./eng/common/mcp/azure-sdk-mcp.ps1", "-Run"]
      cwd: "."

stimuli:

  # ---------------------------------------------------------------------------
  # 001 — Versioning
  # ---------------------------------------------------------------------------

  - name: 001001-version-spread-property
    prompt: >-
      I added `...Azure.ResourceManager.ManagedServiceIdentityProperty;` which updates all my existing API versions and introduces a breaking change. I want to introduce the properties of the spread model '...ManagedServiceIdentityProperty' in a new API version 2025-05-04-preview only.
    environment:
      files:
        - src: ../azure-typespec-author/fixtures/001-share-version-new-feature/employee.tsp
          dest: employee.tsp
        - src: ../azure-typespec-author/fixtures/001-share-version-new-feature/main.tsp
          dest: main.tsp
        - src: ../azure-typespec-author/fixtures/001-share-version-new-feature/shared.tsp
          dest: shared.tsp
        - src: ../azure-typespec-author/fixtures/001-share-version-new-feature/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../azure-typespec-author/fixtures/001-share-version-new-feature/package.json
          dest: package.json
        - src: ../azure-typespec-author/fixtures/001-share-version-new-feature/readme.md
          dest: readme.md
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-api-review"]

  - name: 001002-version-default-value
    prompt: "add a default value `21` for property age in model EmployeeProperties from a new api version 2025-11-01"
    environment:
      files:
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/employee.tsp
          dest: employee.tsp
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-api-review"]

  - name: 001003-version-required-to-optional
    prompt: "change the property age of EmployeeProperties from required to optional for new api version 2025-05-04-preview"
    environment:
      files:
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/employee.tsp
          dest: employee.tsp
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-api-review"]

  - name: 001004-version-property-decorator
    prompt: "change the visibility of property 'provisioningState' from Lifecycle.Read to Lifecycle.Read and Lifecycle.Create in version 2025-05-04-preview only"
    environment:
      files:
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/employee.tsp
