name: skill-invocation-eval
description: Evaluate the skill in spec repo has correct invocation

config:
  runs: 1
  timeout: 300
  model: claude-opus-4.6-1m
  executor: copilot-sdk

environment:
  mcpServers:
    azure-sdk-mcp:
      type: stdio
      command: pwsh
      args: ["./eng/common/mcp/azure-sdk-mcp.ps1", "-Run"]
      cwd: "."

stimuli:  
  - name: skill-invocation-stimuli
    prompt: "add a default value `21` for property age in model EmployeeProperties from a new api version 2025-11-01"
    environment:
      files:
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/employee.tsp
          dest: employee.tsp
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../azure-typespec-author/fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
    graders:
      # - type: no-errors
      # - type: exit-success
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
          disallowed:
            - azure-api-review
